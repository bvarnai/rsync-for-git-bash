name: Publish to scoop
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish to Scoop (e.g. rsync-3.4.2-for-git-2.54.0.windows.1)'
        required: false
        type: string

jobs:
  Update-Bucket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Bucket
        uses: actions/checkout@v4
        with:
          repository: bvarnai/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_PAT }}
          path: scoop-bucket

      - name: Update Manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use input tag if provided (manual run), otherwise use the release event tag
          TAG_NAME="${{ github.event.inputs.tag_name || github.event.release.tag_name }}"

          if [[ -z "$TAG_NAME" ]]; then
            echo "Error: Tag name could not be determined. Provide a tag name if running manually."
            exit 1
          fi

          echo "Processing publication for tag: $TAG_NAME"

          # Find the ZIP asset and its SHA256 asset
          ASSETS=$(gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json assets --jq '.assets[]')

          ZIP_URL=$(echo "$ASSETS" | jq -r 'select(.name | endswith(".zip")) | .url')
          SHA_URL=$(echo "$ASSETS" | jq -r 'select(.name | endswith(".sha256")) | .url')

          if [[ -z "$ZIP_URL" || -z "$SHA_URL" ]]; then
            echo "Error: Could not find ZIP or SHA256 assets in release."
            exit 1
          fi

          # Download the SHA256 file to get the hash
          echo "Downloading SHA256 from $SHA_URL..."
          curl -fL -s "$SHA_URL" -o release.sha256

          # Check if the file is empty or missing
          if [[ ! -s release.sha256 ]]; then
            echo "Error: SHA256 file is empty or could not be downloaded."
            exit 1
          fi

          HASH=$(awk '{print $1}' release.sha256)
          echo "Extracted Hash: $HASH"

          if [[ -z "$HASH" ]]; then
            echo "Error: Could not extract hash from release.sha256"
            exit 1
          fi

          # Use the rsync version as the primary version
          VERSION=$(echo "$TAG_NAME" | sed -E 's/rsync-([0-9.]+)-for-git-.*/\1/')

          echo "Updating manifest for version $VERSION..."

          # The manifest now lives in the bucket repository
          MANIFEST="scoop-bucket/bucket/rsync-for-git-bash.json"

          # Update the fields in-place within the checked-out bucket
          # Using --arg for safer variable substitution in jq
          jq --arg ver "$VERSION" \
             --arg url "$ZIP_URL" \
             --arg hash "$HASH" \
             '.version = $ver | .url = $url | .hash = $hash' \
             "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
      - name: Commit and Push
        run: |
          # Use input tag if provided (manual run), otherwise use the release event tag
          TAG_NAME="${{ github.event.inputs.tag_name || github.event.release.tag_name }}"

          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update rsync-for-git-bash to $TAG_NAME" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_PAT }}

name: Daily release
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  Check:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      rsync_ver: ${{ steps.check.outputs.rsync_ver }}
      git_ver: ${{ steps.check.outputs.git_ver }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      sdk_commit: ${{ steps.resolve.outputs.sdk_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          bash scripts/check-versions.sh

      - id: resolve
        if: steps.check.outputs.needs_build == 'true'
        shell: bash
        run: |
          GIT_VER="${{ steps.check.outputs.git_ver }}"
          OUTPUT=$(bash ./scripts/find-sdk-commit.sh "$GIT_VER")
          echo "$OUTPUT"

          SDK_COMMIT=$(echo "$OUTPUT" | grep "^SDK Commit:" | awk '{print $3}' | tr -d '\r' | xargs)
          if [[ -z "$SDK_COMMIT" ]]; then
            echo "Failed to resolve SDK commit."
            exit 1
          fi
          echo "Resolved SDK commit: $SDK_COMMIT"
          echo "sdk_commit=$SDK_COMMIT" >> $GITHUB_OUTPUT

  Build-Rsync:
    needs: Check
    if: needs.Check.outputs.needs_build == 'true'
    uses: ./.github/workflows/build-rsync.yml
    with:
      rsync_version: ${{ needs.Check.outputs.rsync_ver }}
      git_version: ${{ needs.Check.outputs.git_ver }}
      sdk_commit: ${{ needs.Check.outputs.sdk_commit }}

  Create-Draft-Release:
    needs: [Check, Build-Rsync]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: rsync-${{ needs.Check.outputs.rsync_ver }}-for-git-${{ needs.Check.outputs.git_ver }}-64-bit.zip
          path: ./dist

      - name: Create draft release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.Check.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --title "Rsync ${{ needs.Check.outputs.rsync_ver }} for Git for Windows ${{ needs.Check.outputs.git_ver }}" \
            --draft \
            --notes "This is an automated build of rsync ${{ needs.Check.outputs.rsync_ver }} for Git for Windows ${{ needs.Check.outputs.git_ver }}.

          Built against git-sdk-64 commit: \`${{ needs.Check.outputs.sdk_commit }}\`" \
            ./dist/*.zip \
            ./dist/*.sha256

      - name: Create notification issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Draft Release Ready: Rsync ${{ needs.Check.outputs.rsync_ver }}"
          BODY=$(cat <<EOF
          A new draft release for rsync-for-git-bash is ready for review.
          
          **Rsync Version:** ${{ needs.Check.outputs.rsync_ver }}
          **Git for Windows:** ${{ needs.Check.outputs.git_ver }}
          **Tag:** ${{ needs.Check.outputs.tag_name }}
          
          You can review and publish the draft here:
          ${{ github.server_url }}/${{ github.repository }}/releases
          
          *This issue was created automatically by the Daily Release workflow.*
          EOF
          )
          
          gh issue create --title "$TITLE" --body "$BODY" --repo ${{ github.repository }}

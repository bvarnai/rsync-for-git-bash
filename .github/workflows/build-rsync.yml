name: Parametrized build
on:
  workflow_call:
    inputs:
      rsync_version:
        description: 'Rsync version/tag (without v prefix)'
        required: true
        type: string
      git_version:
        description: 'Git for Windows version'
        required: true
        type: string
      sdk_commit:
        description: 'SDK commit hash'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      rsync_version:
        description: 'Rsync version/tag (without v prefix)'
        required: true
        type: string
      git_version:
        description: 'Git for Windows version'
        required: true
        type: string
      sdk_commit:
        description: 'SDK commit hash'
        required: true
        type: string

jobs:
  Build-Rsync:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clone Dependencies
        run: |
          mkdir -p workspace
          cd workspace

          echo "Fetching specific git-sdk-64 commit..."
          mkdir git-sdk-64
          cd git-sdk-64
          git init
          git remote add origin https://github.com/git-for-windows/git-sdk-64.git
          git fetch origin "${{ inputs.sdk_commit }}" --depth 1
          git checkout FETCH_HEAD
          cd ..

          echo "Cloning rsync version ${{ inputs.rsync_version }}..."
          git clone --depth 1 --branch "v${{ inputs.rsync_version }}" https://github.com/RsyncProject/rsync.git

      - name: Build rsync
        run: |
          echo "Dependencies are ready. Proceeding with MSYS2 build..."

          # Convert GITHUB_WORKSPACE to a path the MSYS2 environment understands
          WORKSPACE_UNIX=$(cygpath -u "${{ github.workspace }}")
          SDK_ROOT_UNIX="$WORKSPACE_UNIX/workspace/git-sdk-64"
          
          # Execute the build script directly using the SDK's bash.
          # We prepend MSYSTEM and PATH so the command runs in the correct environment.
          MSYSTEM=MSYS \
          PATH="$SDK_ROOT_UNIX/usr/bin:$PATH" \
          "$SDK_ROOT_UNIX/usr/bin/bash.exe" \
            "$WORKSPACE_UNIX/scripts/build-rsync.sh" \
            "$WORKSPACE_UNIX/workspace/rsync" \
            "${{ inputs.rsync_version }}"

      - name: Generate versions
        run: |
          GIT_VER="${{ inputs.git_version }}"
          bash ./scripts/generate-versions-md.sh "$GIT_VER" workspace/rsync workspace/git-sdk-64 RELEASE_VERSIONS.md

      - name: Determine package name
        id: pkg-name
        run: |
          ZIP_NAME="rsync-${{ inputs.rsync_version }}-for-git-${{ inputs.git_version }}-64-bit.zip"
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Package rsync
        run: |
          echo "Packaging rsync distribution..."

          WORKSPACE_UNIX=$(cygpath -u "${{ github.workspace }}")
          ZIP_NAME="${{ steps.pkg-name.outputs.zip_name }}"
          SDK_ROOT_UNIX="$WORKSPACE_UNIX/workspace/git-sdk-64"

          # Execute the packaging script directly using the SDK's bash.
          MSYSTEM=MSYS \
          PATH="$SDK_ROOT_UNIX/usr/bin:$PATH" \
          "$SDK_ROOT_UNIX/usr/bin/bash.exe" \
            "$WORKSPACE_UNIX/scripts/package-rsync.sh" \
            "~/build/rsync" \
            "$WORKSPACE_UNIX/$ZIP_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg-name.outputs.zip_name }}
          path: |
            ${{ steps.pkg-name.outputs.zip_name }}
            ${{ steps.pkg-name.outputs.zip_name }}.sha256

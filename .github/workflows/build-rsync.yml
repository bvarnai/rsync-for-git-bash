name: Parametrized build
on:
  workflow_call:
    inputs:
      rsync_version:
        description: 'Rsync version/tag (without v prefix)'
        required: true
        type: string
      git_version:
        description: 'Git for Windows version'
        required: true
        type: string
      sdk_commit:
        description: 'SDK commit hash'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      rsync_version:
        description: 'Rsync version/tag (without v prefix)'
        required: true
        type: string
      git_version:
        description: 'Git for Windows version'
        required: true
        type: string
      sdk_commit:
        description: 'SDK commit hash'
        required: true
        type: string

jobs:
  Build-Rsync:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          bash ./scripts/setup-deps.sh "${{ inputs.rsync_version }}" "${{ inputs.sdk_commit }}"

      - name: Build rsync
        run: |
          REPO_ROOT_UNIX="$(cygpath -u "$PWD")"
          bash ./scripts/run-in-sdk.sh \
            "BUILD_PREFIX='${REPO_ROOT_UNIX}/build/rsync' bash '${REPO_ROOT_UNIX}/scripts/build-rsync.sh' '${REPO_ROOT_UNIX}/deps/rsync' '${{ inputs.rsync_version }}'"

      - name: Generate versions
        run: |
          bash ./scripts/generate-versions-md.sh "${{ inputs.git_version }}" deps/rsync deps/git-sdk-64 RELEASE_VERSIONS.md

      - name: Determine package name
        id: pkg-name
        run: |
          ZIP_NAME="rsync-${{ inputs.rsync_version }}-for-git-${{ inputs.git_version }}-64-bit.zip"
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Package rsync
        run: |
          mkdir -p dist
          REPO_ROOT_UNIX="$(cygpath -u "$PWD")"
          bash ./scripts/run-in-sdk.sh \
            "bash '${REPO_ROOT_UNIX}/scripts/package-rsync.sh' '${REPO_ROOT_UNIX}/build/rsync' '${REPO_ROOT_UNIX}/dist/${{ steps.pkg-name.outputs.zip_name }}'"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg-name.outputs.zip_name }}
          path: |
            dist/${{ steps.pkg-name.outputs.zip_name }}
            dist/${{ steps.pkg-name.outputs.zip_name }}.sha256

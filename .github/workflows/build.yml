name: Build
run-name: ${{ github.actor }} is building rsync 🚀
on:
  push:
    branches: [ main ]

jobs:
  Resolve-Parameters:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      rsync_version: ${{ steps.rsync-version.outputs.version }}
      git_version: ${{ steps.git-version.outputs.version }}
      sdk_commit: ${{ steps.resolve-sdk.outputs.sdk_commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine latest rsync version
        id: rsync-version
        run: |
          RSYNC_TAG=$(curl -s https://api.github.com/repos/RsyncProject/rsync/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$RSYNC_TAG" ]; then
             RSYNC_TAG=$(curl -s "https://api.github.com/repos/RsyncProject/rsync/tags" | grep '"name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          RSYNC_VER=${RSYNC_TAG#v}
          echo "Latest rsync version: $RSYNC_VER"
          echo "version=$RSYNC_VER" >> $GITHUB_OUTPUT

      - name: Determine target Git version
        id: git-version
        run: |
          # Fetch latest release tag from Git for Windows
          GIT_VER=$(curl -s https://api.github.com/repos/git-for-windows/git/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          # Strip the 'v' prefix if present
          GIT_VER=${GIT_VER#v}
          echo "Target Git version: $GIT_VER"
          echo "version=$GIT_VER" >> $GITHUB_OUTPUT

      - name: Clone dependencies for SDK resolution
        run: |
          mkdir -p workspace
          cd workspace

          echo "Cloning build-extra (shallow)..."
          git clone --depth 1 https://github.com/git-for-windows/build-extra.git

          echo "Cloning git-sdk-64 (shallow history, but enough to search recent commits)..."
          git clone --depth 100 https://github.com/git-for-windows/git-sdk-64.git

      - name: Resolve SDK commit
        id: resolve-sdk
        run: |
          GIT_VER="${{ steps.git-version.outputs.version }}"

          OUTPUT=$(bash ./scripts/find-sdk-commit.sh "$GIT_VER" workspace)
          echo "$OUTPUT"

          SDK_COMMIT=$(echo "$OUTPUT" | grep "^SDK Commit:" | awk '{print $3}')

          if [[ -z "$SDK_COMMIT" ]]; then
            echo "Failed to resolve SDK commit."
            exit 1
          fi

          echo "Resolved SDK commit: $SDK_COMMIT"
          echo "sdk_commit=$SDK_COMMIT" >> $GITHUB_OUTPUT

  Call-Build-Workflow:
    needs: Resolve-Parameters
    uses: ./.github/workflows/build-rsync.yml
    with:
      rsync_version: ${{ needs.Resolve-Parameters.outputs.rsync_version }}
      git_version: ${{ needs.Resolve-Parameters.outputs.git_version }}
      sdk_commit: ${{ needs.Resolve-Parameters.outputs.sdk_commit }}

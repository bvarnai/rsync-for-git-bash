name: Build
run-name: ${{ github.actor }} is building rsync 🚀
on:
  push:
    branches: [ main ]

jobs:
  Resolve-Parameters:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      rsync_version: ${{ steps.rsync-version.outputs.version }}
      git_version: ${{ steps.git-version.outputs.version }}
      sdk_commit: ${{ steps.resolve-sdk.outputs.sdk_commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine latest rsync version
        id: rsync-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RSYNC_TAG=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" https://api.github.com/repos/RsyncProject/rsync/releases/latest | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [[ -z "${RSYNC_TAG}" ]]; then
            RSYNC_TAG=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" "https://api.github.com/repos/RsyncProject/rsync/tags" | grep '"name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi
          RSYNC_VER="${RSYNC_TAG#v}"
          if [[ -z "${RSYNC_VER}" ]]; then
            echo "Error: Failed to determine latest rsync version." >&2
            exit 1
          fi
          echo "Latest rsync version: ${RSYNC_VER}"
          echo "version=${RSYNC_VER}" >> "${GITHUB_OUTPUT}"

      - name: Determine target Git version
        id: git-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch latest release tag from Git for Windows
          GIT_VER=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" https://api.github.com/repos/git-for-windows/git/releases/latest | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          # Strip the 'v' prefix if present
          GIT_VER="${GIT_VER#v}"
          if [[ -z "${GIT_VER}" ]]; then
            echo "Error: Failed to determine target Git for Windows version." >&2
            exit 1
          fi
          echo "Target Git version: ${GIT_VER}"
          echo "version=${GIT_VER}" >> "${GITHUB_OUTPUT}"

      - name: Resolve SDK commit
        id: resolve-sdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GIT_VER="${{ steps.git-version.outputs.version }}"

          OUTPUT=$(bash ./scripts/find-sdk-commit.sh "${GIT_VER}")
          echo "${OUTPUT}"

          SDK_COMMIT=$(echo "${OUTPUT}" | grep "^SDK Commit:" | awk '{print $3}' | tr -d '\r' | xargs)

          if [[ -z "${SDK_COMMIT}" ]]; then
            echo "Failed to resolve SDK commit." >&2
            exit 1
          fi

          echo "Resolved SDK commit: ${SDK_COMMIT}"
          echo "sdk_commit=${SDK_COMMIT}" >> "${GITHUB_OUTPUT}"

  Call-Build-Workflow:
    needs: Resolve-Parameters
    uses: ./.github/workflows/build-rsync.yml
    with:
      rsync_version: ${{ needs.Resolve-Parameters.outputs.rsync_version }}
      git_version: ${{ needs.Resolve-Parameters.outputs.git_version }}
      sdk_commit: ${{ needs.Resolve-Parameters.outputs.sdk_commit }}
